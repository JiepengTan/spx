name: Windows

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows
  cancel-in-progress: true

jobs:

  build:
    runs-on: "windows-latest"
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          zip
          unzip
          make
          bash

    - name: Setup go/xgo & engine
      uses: ./.github/actions/deps

    - name: Test
      uses: ./.github/actions/project-test

    - name: Determine architecture
      id: platform
      shell: msys2 {0}
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          echo "arch=amd64" >> $GITHUB_OUTPUT
          echo "go_arch=amd64" >> $GITHUB_OUTPUT
        fi
        echo "platform=windows" >> $GITHUB_OUTPUT

    - name: Download and extract Go toolchain
      shell: msys2 {0}
      run: |
        mkdir -p goenv/gotoolchain
        cd goenv/gotoolchain
        curl -L -O https://go.dev/dl/go1.24.0.windows-${{ steps.platform.outputs.go_arch }}.zip
        unzip -q go1.24.0.windows-${{ steps.platform.outputs.go_arch }}.zip
        rm go1.24.0.windows-${{ steps.platform.outputs.go_arch }}.zip
        cd ../..

    - name: Package goenv
      shell: msys2 {0}
      run: |
        # Get GOPATH from go env
        GOPATH=$(go env GOPATH)
        # Convert Windows path to Unix path for MSYS2
        GOPATH_UNIX=$(cygpath "$GOPATH")

        # Copy runtime files from GOPATH/bin
        mkdir -p goenv/go/bin
        cp "$GOPATH_UNIX"/bin/gdspxrt* goenv/go/bin/ || true
        cp "$GOPATH_UNIX"/bin/runtime.gdextension goenv/go/bin/ || true

        # Copy spx executable from GOPATH/bin
        cp "$GOPATH_UNIX"/bin/spx.exe goenv/go/bin/

        # Create archive
        zip -r goenv-windows-${{ steps.platform.outputs.arch }}.zip goenv

    - name: Upload goenv artifact
      uses: actions/upload-artifact@v4
      with:
        name: goenv-windows-${{ steps.platform.outputs.arch }}
        path: goenv-windows-${{ steps.platform.outputs.arch }}.zip
        retention-days: 7

