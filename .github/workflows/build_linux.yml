name: Linux

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-linux
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Get dependencies
      run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev
      if: ${{ runner.os == 'Linux' }}

    - name: Setup go/xgo & engine
      uses: ./.github/actions/deps

    - name: Test
      uses: ./.github/actions/project-test

    - name: Install zip
      run: sudo apt-get install -y zip

    - name: Download and extract Go toolchain
      run: |
        mkdir -p goenv/gotoolchain
        cd goenv/gotoolchain
        curl -L -O https://go.dev/dl/go1.24.0.linux-amd64.tar.gz
        tar -xzf go1.24.0.linux-amd64.tar.gz
        rm go1.24.0.linux-amd64.tar.gz
        cd ../..

    - name: Collect Go cache by running test project
      run: |
        # Set up cache directories
        mkdir -p goenv/.cache/build
        mkdir -p goenv/.cache/mod

        # Set environment variables to use our cache location
        export GOCACHE=$(pwd)/goenv/.cache/build
        export GOMODCACHE=$(pwd)/goenv/.cache/mod

        # Run test/CI demo to collect dependencies and build cache
        cd test/CI
        $HOME/go/bin/spx run --goenv=../../goenv --path=. --headless &
        SPX_PID=$!

        # Wait a few seconds for initialization
        sleep 5

        # Kill the process
        kill $SPX_PID || true

        cd ../..

        echo "Cache collection completed"
        ls -lah goenv/.cache/build || true
        ls -lah goenv/.cache/mod || true

    - name: Package goenv
      run: |
        mkdir -p goenv/go/bin
        cp $HOME/go/bin/gdspxrt* goenv/go/bin/ || true
        cp $HOME/go/bin/runtime.gdextension goenv/go/bin/ || true
        cp $HOME/go/bin/spx goenv/go/bin/

        # Create zip archive
        cd goenv
        zip -r ../spx-linux-x64-pr.zip .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: spx-linux-x64-pr
        path: spx-linux-x64-pr.zip
        retention-days: 7
